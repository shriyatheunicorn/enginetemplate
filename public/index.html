<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deep Research Agent</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f3;
        --ink: #171a1f;
        --muted: #5d6675;
        --line: #d9ded4;
        --panel: #ffffff;
        --accent: #176b57;
        --accent-dark: #0f4f41;
        --warn: #8a4b00;
        --error: #a52828;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      header {
        border-bottom: 1px solid var(--line);
        background: #ffffff;
      }
      main, .bar {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
      }
      .bar {
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      h1, h2, h3, p { margin: 0; }
      h1 { font-size: 20px; font-weight: 700; }
      h2 { font-size: 18px; margin-bottom: 14px; }
      h3 { font-size: 15px; margin-bottom: 8px; }
      .status {
        color: var(--muted);
        font-size: 13px;
      }
      main {
        padding: 28px 0 48px;
        display: grid;
        gap: 24px;
      }
      form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: end;
      }
      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }
      input {
        width: 100%;
        min-height: 44px;
        border: 1px solid #cbd2c7;
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        padding: 0 12px;
      }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 0 16px;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.68;
      }
      button:not(:disabled):hover { background: var(--accent-dark); }
      section {
        border-top: 1px solid var(--line);
        padding-top: 22px;
      }
      .notice {
        border-left: 4px solid var(--error);
        background: #fff5f5;
        color: var(--error);
        padding: 12px 14px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .metric, .source, .finding {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px;
      }
      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .metric strong {
        display: block;
        font-size: 24px;
        margin-top: 2px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .list {
        display: grid;
        gap: 12px;
      }
      .muted { color: var(--muted); }
      .pass { color: var(--accent-dark); }
      .fail { color: var(--warn); }
      a { color: var(--accent-dark); overflow-wrap: anywhere; }
      pre {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #111827;
        color: #f9fafb;
        border-radius: 6px;
        padding: 14px;
        font-size: 13px;
      }
      @media (max-width: 760px) {
        form, .grid, .metrics {
          grid-template-columns: 1fr;
        }
        .bar {
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          padding: 16px 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>Deep Research Agent</h1>
        <p class="status" id="status">Ready</p>
      </div>
    </header>
    <main>
      <form id="research-form">
        <label>
          Research topic
          <input id="topic" name="topic" maxlength="300" required value="Browserbase Fetch API" />
        </label>
        <button id="submit" type="submit">Run research</button>
      </form>
      <div id="notice"></div>
      <div id="results"></div>
    </main>
    <script>
      const form = document.querySelector("#research-form");
      const topicInput = document.querySelector("#topic");
      const submit = document.querySelector("#submit");
      const statusText = document.querySelector("#status");
      const notice = document.querySelector("#notice");
      const results = document.querySelector("#results");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const topic = topicInput.value.trim();
        if (!topic) return;

        submit.disabled = true;
        statusText.textContent = "Running";
        notice.innerHTML = "";
        results.innerHTML = "";

        try {
          const response = await fetch("/api/research", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ topic }),
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || "Research failed.");
          }
          renderResults(payload);
          statusText.textContent = "Ready";
        } catch (error) {
          notice.innerHTML = `<div class="notice">${escapeHtml(error.message || String(error))}</div>`;
          statusText.textContent = "Ready";
        } finally {
          submit.disabled = false;
        }
      });

      async function checkHealth() {
        try {
          const response = await fetch("/api/health");
          statusText.textContent = response.ok ? "Ready" : "Unavailable";
        } catch {
          statusText.textContent = "Unavailable";
        }
      }

      function renderResults(result) {
        const quality = result.qualityEval || {};
        const verification = result.verification || {};
        const findings = result.report?.keyFindings || [];
        const sources = result.sources || [];
        results.innerHTML = `
          <section>
            <h2>${escapeHtml(result.report?.title || result.topic)}</h2>
            <div class="metrics">
              <div class="metric"><span>Duration</span><strong>${result.durationSec || 0}s</strong></div>
              <div class="metric"><span>Sources</span><strong>${sources.length}</strong></div>
              <div class="metric"><span>Domains</span><strong>${quality.distinctDomains || 0}</strong></div>
              <div class="metric"><span>Overall</span><strong>${verification.overallScore ?? "n/a"}</strong></div>
            </div>
          </section>
          <section>
            <h2>Summary</h2>
            <p>${escapeHtml(result.report?.executiveSummary || "")}</p>
          </section>
          <section>
            <h2>Verification</h2>
            <p class="${verification.pass ? "pass" : "fail"}">Pass: ${verification.pass ? "true" : "false"}</p>
            <p class="muted">${escapeHtml(verification.summary || "")}</p>
          </section>
          <section>
            <h2>Key Findings</h2>
            <div class="list">
              ${findings.map((finding) => `
                <div class="finding">
                  <h3>${escapeHtml(finding.confidence || "medium")} confidence</h3>
                  <p>${escapeHtml(finding.finding || "")}</p>
                  <p class="muted">Sources: ${(finding.sourceIds || []).map((id) => `[${id}]`).join(", ") || "none"}</p>
                </div>
              `).join("")}
            </div>
          </section>
          <section>
            <h2>Sources</h2>
            <div class="grid">
              ${sources.map((source) => `
                <div class="source">
                  <h3>[${source.id}] ${escapeHtml(source.title)}</h3>
                  <p><a href="${escapeHtml(source.url)}">${escapeHtml(source.domain)}</a></p>
                  <p class="muted">${escapeHtml(source.sourceType)} | ${source.wordCount} words | reliability ${source.reliabilityScore}</p>
                </div>
              `).join("")}
            </div>
          </section>
          <section>
            <h2>Artifacts</h2>
            <pre>${escapeHtml(JSON.stringify(result.artifacts, null, 2))}</pre>
          </section>
        `;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      checkHealth();
    </script>
  </body>
</html>
